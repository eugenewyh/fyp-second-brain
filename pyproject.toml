[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "0.1.0"
description = "Graph-based multi-agent system for autonomous research and lifelong personal knowledge management"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]